[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = [
  "/app",
  "/alembic",
  "/docker",
  "/docs",
  "/examples",
  "/scripts",
  "/.env.example",
  "/.gitignore",
  "/AGENTS.md",
  "/Makefile",
  "/README.md",
  "/alembic.ini",
  "/docker-compose.yml",
  "/docker-compose.prod.yml",
  "/pyproject.toml",
]

[project]
name = "bot-trading-platform"
version = "0.1.0"
description = "Enterprise-grade bot trading platform scaffold"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "kokomoor" }]
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.31.0,<1.0.0",
  "pydantic>=2.9.0,<3.0.0",
  "pydantic-settings>=2.5.0,<3.0.0",
  "sqlalchemy>=2.0.35,<3.0.0",
  "alembic>=1.13.0,<2.0.0",
  "asyncpg>=0.29.0,<1.0.0",
  "redis>=5.1.0,<6.0.0",
  "structlog>=24.4.0,<25.0.0",
  "prometheus-client>=0.21.0,<1.0.0",
  "httpx>=0.27.0,<1.0.0",
  "orjson>=3.10.0,<4.0.0",
  "python-json-logger>=2.0.7,<3.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "pytest-asyncio>=0.24.0,<1.0.0",
  "pytest-cov>=5.0.0,<6.0.0",
  "mypy>=1.11.0,<2.0.0",
  "ruff>=0.6.0,<1.0.0",
  "types-redis>=4.6.0.20241004",
]

[project.scripts]
btp-api = "app.services.api.main:run"
btp-runner = "app.services.strategy_runner.main:run"
btp-reconciler = "app.services.reconciler.main:run"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --strict-config --cov=app --cov-report=term-missing --cov-report=xml"
testpaths = ["app/tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ANN", "ASYNC"]
ignore = ["ANN101", "ANN102"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
check_untyped_defs = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
plugins = []
mypy_path = ["app"]
exclude = ["^alembic/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
