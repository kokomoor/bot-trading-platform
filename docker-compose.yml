version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: .env
    command: ["uvicorn", "app.services.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  strategy-runner:
    build:
      context: .
      dockerfile: docker/runner.Dockerfile
    env_file: .env
    command: ["python", "-m", "app.services.strategy_runner.main"]
    depends_on:
      - postgres
      - redis

  reconciler:
    build:
      context: .
      dockerfile: docker/reconciler.Dockerfile
    env_file: .env
    command: ["python", "-m", "app.services.reconciler.main"]
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trading
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  pg_data:
  redis_data:
